# 釘住用的參數，為了能重現——以這份為準，不要在 README.md 裡再寫一次。
# Pin these for reproducibility -- treat this file as authoritative.
model: jev-latest            # answered by jev-1.13.0 on the run date
question_type: choice        # one Choice per call; wording frozen in run.py
arms:
  self_no_context: 357       # every utterance of 30 whole dialogues, line only
  self_context: 357          # same, plus up to 4 preceding turns
  listening_no_context: 229  # speaker-change pairs: what face should the listener wear
  listening_context: 229     # same, plus up to 4 preceding turns
repeats: 3
workers: 8
dialogues: 30                # sampled from the 192 test dialogues with >= 6 utterances
min_turns: 6
context_turns: 4
seed: 29                     # dialogue sampling
bootstrap: 2000              # paired resampling over items, seed 31
bins: 15                     # ECE, equal-width on the max probability
run_date: "2026-09-23"
sampling_note: >
  Natural label distribution (neutral is 45.9% of the speaker arm's gold), unlike
  suites/expression-selection/ which sampled 40 per class. The always-neutral baseline
  is therefore the number to read accuracy against, not chance.
listening_oracle: >
  MELD does not label the listener's expression. The proxy used here is the emotion label
  of the listener's own immediately following utterance, for adjacent pairs where the
  speaker changes. It is somebody else's label, not one we invented, but it is a proxy:
  a listener's next line is shaped by more than the line they just heard.
data_source: >
  MELD test split via Hugging Face zrr1999/MELD_Text
  @ 442fba93972d9cc642b9bbdafd123740e02d3250 (test_sent_emo.csv), a text-only mirror of
  declare-lab/MELD.
data_license: >
  GPL-3.0 upstream (declare-lab/MELD), derived from copyrighted TV dialogue. The text is
  not committed: cases.json and data/_cache/ are gitignored and the receipts store the
  SHA-256 of each state. Audit with `python data/build_cases.py --verify runs/<date>.json`.
question_wording_credit: >
  The speaker arms reuse suites/expression-selection/'s wording verbatim, which in turn
  takes its "judge the expressed tone, not the inner state" boundary from
  fand/jev-emotional-avatar (MIT).
