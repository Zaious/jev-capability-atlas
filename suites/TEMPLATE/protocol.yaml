# 釘住用的參數，為了能重現——以這份為準，不要在 README.md 裡再寫一次。
# Pin these for reproducibility -- treat this file as authoritative,
# don't re-state values in README.md that could drift out of sync.
model: jev-latest         # 或釘住版號，例如 jev-1.13.0 / or a pinned build
auto_accept_threshold: 0.8
sample_size: 0            # 填實際題數 / fill in the real item count
annotators: 1             # 標答案的人數，誠實填 / how many people labeled ground truth
run_date: ""              # YYYY-MM-DD，真正執行那天 / the day it actually ran
data_source: ""           # 自編／公開資料集（附連結）／去識別化的私人資料 / original, public dataset (link), or de-identified private data
data_license: ""          # 例如 ODC-By、CC BY 4.0；自編填 original / e.g. ODC-By, CC BY 4.0; "original" if self-written
